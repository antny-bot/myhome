<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner Soft Glow -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Main Symbol Group with Filter -->
  <g filter="url(#dropShadow)">
    <!-- House Roof -->
    <path d="M128 240 L256 136 L384 240" fill="none" stroke="url(#roofGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Chimney / Indicator -->
    <path d="M336 170 V144 H364 V192" fill="none" stroke="url(#roofGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Building Pillars & Growth Bars -->
    <!-- Bar 1 (Left / Low) -->
    <rect x="168" y="272" width="36" height="112" rx="10" fill="#FFFFFF" fill-opacity="0.9"/>
    <!-- Bar 2 (Middle / Medium) -->
    <rect x="238" y="224" width="36" height="160" rx="10" fill="url(#accentGrad)"/>
    <!-- Bar 3 (Right / High - Analytics Peak) -->
    <rect x="308" y="192" width="36" height="192" rx="10" fill="#FFFFFF"/>
    
    <!-- Trend Line / Sparkline across bars -->
    <circle cx="186" cy="272" r="8" fill="#38BDF8"/>
    <circle cx="256" cy="224" r="8" fill="#FFFFFF"/>
    <circle cx="326" cy="192" r="8" fill="#FBBF24"/>
    <path d="M186 272 L256 224 L326 192" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
