name: Sync Docs to Central LLM-Wiki

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App Repo
        uses: actions/checkout@v4

      - name: Checkout Central llm-wiki Repo
        uses: actions/checkout@v4
        with:
          repository: antny-bot/llm-wiki
          token: ${{ secrets.WIKI_PAT }}
          path: central-wiki

      - name: Mirror docs to wiki sources
        run: |
          PROJECT_NAME=${GITHUB_REPOSITORY#*/}
          echo "Syncing docs for project: $PROJECT_NAME"
          mkdir -p central-wiki/sources/$PROJECT_NAME
          rsync -av --delete --exclude 'archived/' --exclude 'assets/' docs/ central-wiki/sources/$PROJECT_NAME/

      - name: Commit and Push to llm-wiki
        working-directory: central-wiki
        run: |
          git config user.name "wiki-sync-bot[bot]"
          git config user.email "wiki-sync-bot[bot]@users.noreply.github.com"
          git add sources/
          if ! git diff --cached --quiet; then
            git commit -m "docs(${{ github.event.repository.name }}): sync docs from ${{ github.sha }}"
            git push
          else
            echo "No changes in docs to push."
          fi
